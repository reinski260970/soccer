name: european-hockey-scan
on:
  push:
    paths:
      - ".github/european-hockey-run-now.txt"
  workflow_dispatch:
concurrency:
  group: european-hockey-scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: European hockey scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m oddswatch scan --sports hockey_eu --days 3 --watch-days 7 --send
      - name: Save journal and reports
        if: always()
        run: |
          git config user.name "oddswatch-bot"
          git config user.email "oddswatch-bot@users.noreply.github.com"
          git add data/journal reports || true
          git diff --cached --quiet || git commit -m "European hockey scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
