name: NHL V6 Prematch Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "oddswatch/nhl_v6_feature_bridge.py"
      - "oddswatch/nhl_v6_prematch.py"
      - "oddswatch/nhl_v6_live_run.py"
      - "oddswatch/nhl_first_period.py"
      - "oddswatch/nhl_p1_backtest.py"
      - "oddswatch/nhl_first_period.py"
      - "oddswatch/nhl_v6_espn_results.py"
      - "tests/test_nhl_v6_feature_bridge.py"
      - ".github/workflows/nhl-v6-prematch.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify feature bridge and V6 code
        run: |
          python -m compileall -q oddswatch/nhl_v6_feature_bridge.py oddswatch/nhl_v6_prematch.py
          python -m pytest tests/test_nhl_v6_feature_bridge.py tests/test_nhl_bulk_v6.py -q
      - name: Verify current MoneyPuck download and parse
        run: |
          python - <<'PY'
          from oddswatch.nhl_v5_1_forward import download_text, parse_team_games
          games = parse_team_games(download_text())
          assert games, "No MoneyPuck team games parsed"
          print("MoneyPuck team rows:", len(games), "latest:", max(g["date"] for g in games))
          PY

      - name: Fetch verified ESPN NHL results
        run: python -m oddswatch.nhl_v6_espn_results --start 2025-10
      - name: Walk-forward validate first-period model
        run: python -m oddswatch.nhl_p1_backtest --results data/hockey/nhl_espn_results.csv
      - name: Build current MoneyPuck feature history
        run: python -m oddswatch.nhl_v6_moneypuck_convert --out data/hockey/market/nhl_moneypuck_games_live.csv
      - name: Calculate NHL V6 independent fair odds
        run: python -m oddswatch.nhl_v6_live_run --results data/hockey/nhl_espn_results.csv --moneypuck data/hockey/market/nhl_moneypuck_games_live.csv --schedule data/hockey/nhl_espn_schedule.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhl-v6-fair-odds
          path: |
            data/hockey/nhl_v6_fair_today.json
            data/hockey/nhl_p1_walkforward.json
