name: NHL Bulk Historical Market Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "oddswatch/nhl_bulk_import.py"
      - "oddswatch/nhl_bulk_backtest.py"
      - "tests/test_nhl_bulk_backtest.py"
      - ".github/workflows/nhl-bulk-backtest.yml"

permissions:
  contents: write

concurrency:
  group: nhl-bulk-historical-market-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Test bulk import and no-lookahead rules
        run: python -m pytest tests/test_nhl_bulk_backtest.py -q
      - name: Download one pinned public bulk file and normalize
        run: python -m oddswatch.nhl_bulk_import
      - name: Run large NHL market backtest
        run: python -m oddswatch.nhl_bulk_backtest
      - uses: actions/upload-artifact@v4
        with:
          name: nhl-bulk-market-backtest
          path: |
            data/hockey/market/nhl_sbr_2011_2021.csv
            data/hockey/market/nhl_sbr_2011_2021.provenance.json
            data/hockey/nhl_bulk_backtest.json
      - name: Save normalized bulk data and result
        run: |
          git config user.name "oddswatch-bot"
          git config user.email "oddswatch-bot@users.noreply.github.com"
          cp data/hockey/market/nhl_sbr_2011_2021.csv /tmp/nhl_bulk.csv
          cp data/hockey/market/nhl_sbr_2011_2021.provenance.json /tmp/nhl_bulk.provenance.json
          cp data/hockey/nhl_bulk_backtest.json /tmp/nhl_bulk_backtest.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/nhl_bulk.csv data/hockey/market/nhl_sbr_2011_2021.csv
            cp /tmp/nhl_bulk.provenance.json data/hockey/market/nhl_sbr_2011_2021.provenance.json
            cp /tmp/nhl_bulk_backtest.json data/hockey/nhl_bulk_backtest.json
            git add data/hockey/market/nhl_sbr_2011_2021.csv                     data/hockey/market/nhl_sbr_2011_2021.provenance.json                     data/hockey/nhl_bulk_backtest.json
            git diff --cached --quiet && exit 0
            git commit -m "Import 10Y NHL historical odds and backtest"
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
