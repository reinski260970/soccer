name: tennis-telegram-test
on:
  push:
    paths:
      - ".github/tennis-run-now.txt"
  workflow_dispatch:
jobs:
  tennis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tennis from tennis_db
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONGODB_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
          MONGO_URI: ${{ secrets.MONGO_URI || secrets.MONGODB_URI }}
          MONGODB_DB: tennis_db
          MONGO_DB_NAME: tennis_db
        run: python -m oddswatch tennis --send --all
