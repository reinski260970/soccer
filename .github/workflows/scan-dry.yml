name: scan-dry

# Spieltags-Scan auf Abruf: Modelle + Preise, Ausgabe nur im Lauf (Notice).
# Kein Telegram, kein Journal-Commit. Sharpery-Excel landet auf dem Branch "exports".
on:
  workflow_dispatch:
    inputs:
      sports:
        description: "Sportarten (soccer,nhl,hockey_eu,nfl,nba)"
        default: "soccer,hockey_eu,nhl"
      days:
        description: "Tage voraus"
        default: "1"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APIKEY: ${{ secrets.APIKEY }}
      MONGO_SOCCER: ${{ secrets.MONGO_SOCCER }}
      SPORTS_DATABASE_URL: ${{ secrets.SPORTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Scan
        run: |
          python -m oddswatch scan --sports "${{ inputs.sports }}" --days "${{ inputs.days }}" --watch-days 3 --dry --sharpery out/sharpery-scan > scan.txt 2>&1 || true
          wc -l scan.txt
          cat scan.txt
          split -l 120 scan.txt part_
          for f in part_*; do echo "::notice title=scan-$f::$(sed ':a;N;$!ba;s/\n/%0A/g' $f)"; done
      - name: Sharpery-Excel auf Branch exports ablegen
        if: always()
        run: |
          [ -f out/sharpery-scan.xlsx ] || exit 0
          stamp=$(TZ=Europe/Vienna date +%Y-%m-%d_%H%M)
          mkdir pub && cp out/sharpery-scan.xlsx "pub/sharpery-scan-$stamp.xlsx" && cp out/sharpery-scan.xlsx pub/sharpery-scan-latest.xlsx
          cd pub
          git init -q -b exports
          git config user.name "oddswatch-bot"
          git config user.email "oddswatch-bot@users.noreply.github.com"
          git add . && git commit -qm "Sharpery-Export $stamp"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" exports
