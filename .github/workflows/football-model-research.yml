name: football-model-research

on:
  push:
    paths:
      - ".github/football-model-run-now.txt"
  workflow_dispatch:

concurrency:
  group: football-model-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests/test_m13.py tests/test_m14.py tests/test_m17_2.py tests/test_m17_3.py tests/test_m17_4.py tests/test_m17_5.py tests/test_m17_6.py tests/test_m17_7.py tests/test_m17_8.py tests/test_m17_9.py tests/test_m17_10.py tests/test_m17_11.py tests/test_m17_12.py tests/test_m17_13.py tests/test_soccerstats.py
      - name: M17.13 structural-uncertainty gate strict walk-forward
        env:
          MONGO_SOCCER: ${{ secrets.MONGO_SOCCER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python -m oddswatch.m17_13_research
      - name: Persist M17.13 validation artifact
        run: |
          git config user.name "oddswatch-bot"
          git config user.email "oddswatch-bot@users.noreply.github.com"
          git add data/m17_13_validation.json
          git diff --cached --quiet || git commit -m "M17.13 validation refresh"
          git pull --rebase --autostash
          git push
