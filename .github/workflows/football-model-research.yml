name: football-model-research

on:
  push:
    paths:
      - ".github/football-model-run-now.txt"
  workflow_dispatch:

concurrency:
  group: football-model-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests/test_m13.py tests/test_m14.py tests/test_m17_2.py tests/test_m17_3.py tests/test_m17_4.py tests/test_m17_5.py tests/test_m17_6.py tests/test_soccerstats.py
      - name: SoccerSTATS historical smoke
        run: |
          python - <<'PY'
          from oddswatch.sources import soccerstats
          rows, err = soccerstats.team_homeaway("D2", 2024, cache_days=0)
          print("SoccerSTATS D2 2024:", len(rows), "teams", err or "OK")
          if len(rows) < 10:
              raise SystemExit("historical SoccerSTATS unavailable")
          PY
      - name: M17.6 SoccerSTATS-prior strict walk-forward
        env:
          MONGO_SOCCER: ${{ secrets.MONGO_SOCCER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python -m oddswatch.m17_6_research
      - name: Persist M17.6 validation artifact
        run: |
          git config user.name "oddswatch-bot"
          git config user.email "oddswatch-bot@users.noreply.github.com"
          git add data/m17_6_validation.json
          git diff --cached --quiet || git commit -m "M17.6 validation refresh"
          git pull --rebase --autostash
          git push
