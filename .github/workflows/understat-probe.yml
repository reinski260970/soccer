name: understat-probe
on:
  push:
    branches:
      - understat-probe
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe Understat xG
        run: |
          python - <<'PY'
          from oddswatch import fetch
          from oddswatch.sources import understat
          url = "https://understat.com/getLeagueData/EPL/2025"
          raw, err = fetch.get(url, cache_days=0, headers={
              "Referer":"https://understat.com/league/EPL/2025",
              "X-Requested-With":"XMLHttpRequest",
          })
          print("RAW_ERR=", err)
          print("RAW_PREFIX=", repr((raw or "")[:1500]))
          print("RAW_LEN=", len(raw or ""))
          for code in ("E0","D1","SP1","I1","F1"):
              rows, err = understat.season_matches(code, 2025, cache_days=0)
              print(code, "n=", len(rows), "err=", err)
              if rows:
                  r = rows[-1]
                  print(" sample:", r.date, r.home, r.away, r.home_goals, r.away_goals, r.home_xg, r.away_xg)
          PY
