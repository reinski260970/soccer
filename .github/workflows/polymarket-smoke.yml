name: polymarket-smoke

on:
  push:
    paths:
      - ".github/polymarket-smoke-run.txt"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compile Polymarket source
        run: python -m py_compile oddswatch/sources/polymarket.py
      - name: Match current NFL/NHL markets
        run: |
          python - <<'PY'
          from datetime import date
          from oddswatch.sources import espn, polymarket

          for league in ("nfl", "nhl"):
              qs, err = polymarket.discover(league)
              print(f"{league.upper()} discovered={len(qs)} err={err}")
              games, errs = espn.upcoming(league, date.today(), 3)
              scheduled = [g for g in games if g.status == "STATUS_SCHEDULED"]
              hits = []
              for g in scheduled:
                  hit = polymarket.find(qs, g)
                  if not hit and league == "nfl":
                      q, derr = polymarket.direct_quote(league, g)
                      if q:
                          hi = polymarket._team_side(q, g.home.aliases())
                          ai = polymarket._team_side(q, g.away.aliases())
                          if hi is not None and ai is not None and hi != ai:
                              hit = (q, hi, ai)
                  if hit:
                      q, hi, ai = hit
                      hits.append((g.title, q.outcomes[hi], q.outcomes[ai], q.mids[hi], q.mids[ai]))
              print(f"{league.upper()} scheduled={len(scheduled)} matched={len(hits)}")
              for row in hits[:10]:
                  print("MATCH", row)
          PY
