# Tagesbericht mit Ausblick nach Sportart, jeden Morgen ab 8:00 Wiener Zeit.
# GitHub startet geplante Läufe oft Stunden zu spät oder lässt einzelne aus.
# Deshalb mehrere Startzeiten (06:17–11:17 UTC); der Prüfschritt lässt den
# ersten Lauf ab 8 Uhr Wien zu, für den es heute noch keinen Tagesbericht
# (reports/<datum>-daily.txt) gibt. Von Hand (Run workflow) immer.
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, optional MONGODB_URI (Tennis).
name: daily-report
on:
  schedule:
    - cron: "17 6-11 * * *"
  workflow_dispatch:
concurrency:
  group: quick-scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Heute schon gelaufen?
        id: gate
        run: |
          h=$(TZ=Europe/Vienna date +%-H)
          f="reports/$(date -u +%Y-%m-%d)-daily.txt"
          echo "Wien: $(TZ=Europe/Vienna date '+%d.%m.%Y %H:%M %Z')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          elif [ "$h" -ge 8 ] && [ ! -f "$f" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Übersprungen: vor 8 Uhr oder $f existiert bereits"
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.gate.outputs.run == 'yes'
        run: pip install -r requirements.txt
      - name: Tagesbericht mit Ausblick
        if: steps.gate.outputs.run == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIKEY: ${{ secrets.APIKEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python -m oddswatch daily --send --force
      - name: Journal und Bericht sichern
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "oddswatch-bot"
          git config user.email "oddswatch-bot@users.noreply.github.com"
          git add data/journal data/snapshots reports
          git diff --cached --quiet || git commit -m "Tagesbericht $(TZ=Europe/Vienna date '+%d.%m.%Y %H:%M')"
          git pull --rebase --autostash && git push
