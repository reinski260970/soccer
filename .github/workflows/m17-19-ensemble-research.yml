name: m17-19-ensemble-research

on:
  push:
    paths:
      - ".github/m17-19-run-now.txt"
  workflow_dispatch:

concurrency:
  group: m17-19-ensemble-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: M17.19 ensemble safeguards
        run: python -m pytest -q tests/test_m17_19_ensemble.py
      - name: Run M17.19 ensemble challenger
        env:
          MONGO_SOCCER: ${{ secrets.MONGO_SOCCER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python -m oddswatch.m17_19_ensemble_research
      - name: Persist ensemble artifact
        run: |
          git config user.name "oddswatch-bot"
          git config user.email "oddswatch-bot@users.noreply.github.com"
          git add data/m17_19_ensemble_validation.json
          git diff --cached --quiet || git commit -m "M17.19 ensemble challenger validation"
          git pull --rebase --autostash
          git push
