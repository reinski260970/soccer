name: Hockey OOS Calibration Research
on:
  workflow_dispatch:
  push:
    paths:
      - "oddswatch/hockey_recalibration.py"
      - "tests/test_hockey_recalibration.py"
      - ".github/workflows/hockey-calibration-research.yml"
  schedule:
    - cron: "5 6 * * *"
permissions:
  contents: read
concurrency:
  group: hockey-nested-calibration
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Test strict chronological separation
        run: python -m pytest tests/test_hockey_recalibration.py -q
      - name: Run previous-season tuned model on next season
        run: python -m oddswatch.hockey_recalibration
      - uses: actions/upload-artifact@v4
        with:
          name: hockey-nested-calibration-research
          path: data/hockey/recalibration_research.json
