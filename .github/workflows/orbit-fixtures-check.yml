name: orbit-fixtures-check

# Nur Diagnose: liest den Orbit-Spielplan aus Neon und macht einen Hockey-Trockenlauf.
# Kein Telegram, kein Journal-Commit.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPORTS_DATABASE_URL: ${{ secrets.SPORTS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Orbit-Spielplan in Neon
        run: |
          python - > orbit.txt <<'PY'
          from sqlalchemy import text
          from oddswatch.sql_store import engine
          from oddswatch.sources.orbit_fixtures import league_of
          with engine().connect() as c:
              rows = c.execute(text("SELECT competition, count(*) n, min(start_utc), max(start_utc), max(seen_at) "
                                    "FROM sports.orbit_fixtures GROUP BY competition ORDER BY n DESC")).all()
              for r in rows:
                  print(f"{r[0]!r:40} n={r[1]:3} -> {league_of(r[0])}  {r[2]} .. {r[3]}  seen {r[4]}")
              for r in c.execute(text("SELECT competition, home, away FROM sports.orbit_fixtures ORDER BY start_utc")).all():
                  print(f"  {r[0]} | {r[1]} – {r[2]}")
          PY
          cat orbit.txt
          echo "::notice title=orbit::$(sed ':a;N;$!ba;s/\n/%0A/g' orbit.txt)"
      - name: Hockey-Trockenlauf (DEL, Extraliga)
        run: |
          python -m oddswatch scan --sports hockey_eu --days 3 --watch-days 7 --dry > scan.txt 2>&1 || true
          grep -iE "DEL|Extraliga|Orbit|zugeordnet|Ergebnisse|Traceback|Error" scan.txt | head -60 > hit.txt || true
          cat hit.txt
          echo "::notice title=scan::$(sed ':a;N;$!ba;s/\n/%0A/g' hit.txt)"
