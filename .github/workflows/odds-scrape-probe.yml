name: Odds Scrape Probe (oddsportal/betexplorer)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe oddsportal + betexplorer hockey pages (max 6 requests, read-only)
        run: |
          python - <<'PY'
          import re
          import urllib.request
          import urllib.error

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/120.0 Safari/537.36")

          TARGETS = [
              ("betexplorer", "czech-republic/extraliga",
               "https://www.betexplorer.com/hockey/czech-republic/extraliga/"),
              ("betexplorer", "slovakia/extraliga",
               "https://www.betexplorer.com/hockey/slovakia/extraliga/"),
              ("betexplorer", "norway/eliteserien",
               "https://www.betexplorer.com/hockey/norway/eliteserien/"),
              ("oddsportal", "czech-republic/extraliga",
               "https://www.oddsportal.com/hockey/czech-republic/extraliga/"),
              ("oddsportal", "slovakia/extraliga",
               "https://www.oddsportal.com/hockey/slovakia/extraliga/"),
              ("oddsportal", "norway/eliteserien",
               "https://www.oddsportal.com/hockey/norway/eliteserien/"),
          ]

          CHALLENGE_MARKERS = (
              "cf-browser-verification", "Just a moment", "Checking your browser",
              "cloudflare", "captcha", "Attention Required",
          )
          # Typical decimal-odds pattern (e.g. 1.85, 2.10, 11.00)
          ODDS_RE = re.compile(r"\b\d{1,3}\.\d{2}\b")
          TABLE_RE = re.compile(r"<table\b", re.I)
          SCRIPT_STYLE_RE = re.compile(r"<(script|style)\b.*?</\1>", re.I | re.S)

          calls = 0
          for site, league, url in TARGETS:
              calls += 1
              print(f"\n=== [{calls}/6] {site} / {league} ===")
              print("URL:", url)
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9,de;q=0.8",
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      status = resp.status
                      body = resp.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as e:
                  print("HTTP ERROR:", e.code)
                  try:
                      body = e.read().decode("utf-8", errors="replace")
                  except Exception:
                      body = ""
                  status = e.code
              except Exception as e:
                  print("REQUEST FAILED:", type(e).__name__, str(e))
                  continue

              print("HTTP status:", status)
              print("Body length:", len(body))

              hit_markers = [m for m in CHALLENGE_MARKERS if m.lower() in body.lower()]
              print("Bot-challenge markers found:", hit_markers or "none")

              odds_hits = ODDS_RE.findall(body)
              print("Decimal-odds-like tokens found:", len(odds_hits),
                    "(sample:", odds_hits[:10], ")")

              table_count = len(TABLE_RE.findall(body))
              print("<table> tag count:", table_count)

              # Strip script/style blocks, then show a short, readable excerpt
              # so we can eyeball the real structure without a huge dump.
              clean = SCRIPT_STYLE_RE.sub(" ", body)
              clean = re.sub(r"\s+", " ", clean).strip()
              print("Excerpt (first 800 chars, scripts/styles stripped):")
              print(clean[:800])

          print(f"\nTotal requests made: {calls}")
          PY
