name: Odds Scrape Probe (oddsportal/betexplorer)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find correct league URLs + inspect real table markup (max 8 requests, read-only)
        run: |
          python - <<'PY'
          import re
          import urllib.request
          import urllib.error

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/120.0 Safari/537.36")

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9,de;q=0.8",
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, resp.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as e:
                  try:
                      body = e.read().decode("utf-8", errors="replace")
                  except Exception:
                      body = ""
                  return e.code, body
              except Exception as e:
                  return None, f"REQUEST FAILED: {type(e).__name__} {e}"

          calls = 0

          # --- Part A: find the real current-season Slovakia/Norway hockey URLs
          # by reading the country hub pages and extracting hockey league links.
          HUBS = [
              ("slovakia", "https://www.betexplorer.com/hockey/slovakia/"),
              ("norway", "https://www.betexplorer.com/hockey/norway/"),
          ]
          LINK_RE = re.compile(r'href="(/hockey/[a-z-]+/[a-z0-9-]+/)"', re.I)
          for country, url in HUBS:
              calls += 1
              print(f"\n=== HUB [{calls}] {country} ===")
              print("URL:", url)
              status, body = fetch(url)
              print("HTTP status:", status, "| length:", len(body))
              links = sorted(set(LINK_RE.findall(body)))
              country_links = [l for l in links if f"/{country}/" in l]
              print(f"Hockey links containing /{country}/:", country_links[:20])

          # --- Part B: pull the real table markup from the working Czech page
          # so the actual row/column structure is visible (not just counts).
          calls += 1
          url = "https://www.betexplorer.com/hockey/czech-republic/extraliga/"
          print(f"\n=== TABLE DUMP [{calls}] czech-republic/extraliga ===")
          print("URL:", url)
          status, body = fetch(url)
          print("HTTP status:", status, "| length:", len(body))
          tables = re.findall(r"<table\b.*?</table>", body, re.I | re.S)
          print("Tables found:", len(tables))
          for i, t in enumerate(tables):
              # Strip script/style noise, collapse whitespace, cap length
              t_clean = re.sub(r"<(script|style)\b.*?</\1>", " ", t, flags=re.I | re.S)
              t_clean = re.sub(r">\s+<", "><", t_clean)
              print(f"\n--- table #{i} (first 2500 chars) ---")
              print(t_clean[:2500])

          print(f"\nTotal requests made: {calls}")
          PY
