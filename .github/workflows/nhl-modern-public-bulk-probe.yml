name: Modern NHL Public Bulk Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/nhl-modern-public-bulk-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe public committed NHL gzip only
        run: |
          python - <<'PY'
          import csv, gzip, io, json, urllib.request
          url="https://raw.githubusercontent.com/KyleBastien/sportsnot/main/ml/data/raw/odds-archive/kaggle-nhl-historical/nhl_data_extensive.csv.gz"
          req=urllib.request.Request(url,headers={"User-Agent":"oddswatch-research/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              blob=r.read()
          print("bytes",len(blob))
          text=gzip.decompress(blob).decode("utf-8-sig","replace")
          reader=csv.DictReader(io.StringIO(text))
          print("columns",json.dumps(reader.fieldnames))
          n=0; samples=[]; dates=[]; seasons=set()
          odds_fields=[x for x in (reader.fieldnames or []) if any(k in x.lower() for k in ("odd","money","line","price","close","open"))]
          print("odds_like_fields",json.dumps(odds_fields))
          nonempty={k:0 for k in odds_fields}
          unique={k:set() for k in odds_fields}
          for row in reader:
              n+=1
              if len(samples)<3: samples.append(row)
              for k in ("date","gameDate","game_date","season","Season","seasonId"):
                  if row.get(k):
                      if "season" in k.lower(): seasons.add(row[k])
                      else: dates.append(row[k])
              for k in odds_fields:
                  v=(row.get(k) or "").strip()
                  if v:
                      nonempty[k]+=1
                      if len(unique[k])<20: unique[k].add(v)
          print("rows",n)
          print("seasons",sorted(seasons)[:10],sorted(seasons)[-10:])
          if dates: print("date_minmax",min(dates),max(dates))
          print("odds_nonempty",json.dumps(nonempty))
          print("odds_examples",json.dumps({k:sorted(v)[:10] for k,v in unique.items()}))
          for i,row in enumerate(samples):
              print("sample",i,json.dumps(row)[:6000])
          PY
