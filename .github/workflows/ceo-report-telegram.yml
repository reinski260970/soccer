# CEO Matchday Report direkt zu Telegram, ohne Make.
# Bestehende Secrets werden wiederverwendet:
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, APIKEY, optional MONGODB_URI.
name: ceo-report-telegram

on:
  push:
    paths:
      - ".github/ceo-run-now.txt"
  schedule:
    # Separate cron expressions are intentional: github.event.schedule then
    # identifies the intended CEO slot even when GitHub starts a run hours late.
    # Paired UTC hours cover CEST/CET; the report file deduplicates the pair.
    - cron: "7 6 * * *"
    - cron: "7 7 * * *"
    - cron: "7 10 * * *"
    - cron: "7 11 * * *"
    - cron: "7 17 * * *"
    - cron: "7 18 * * *"
  workflow_dispatch:

concurrency:
  group: quick-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ceo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: CEO-Zeitfenster prüfen
        id: gate
        shell: bash
        run: |
          now="$(TZ=Europe/Vienna date '+%Y-%m-%d %H:%M %Z')"
          h="$(TZ=Europe/Vienna date +%-H)"
          day="$(TZ=Europe/Vienna date +%Y-%m-%d)"
          echo "Wien: $now"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            # Manual push around noon takes the 12:00 report slot.
            # The regular 12:07 run sees its committed report and skips.
            if [ "$h" = "11" ] || [ "$h" = "12" ]; then
              slot="12"
            else
              slot="manual-$(TZ=Europe/Vienna date +%H%M)"
            fi
            f="reports/${day}-ceo-${slot}.txt"
            if [ -f "$f" ]; then
              echo "CEO-Slot bereits vorhanden: $f"
              echo "run=no" >> "$GITHUB_OUTPUT"
            else
              echo "run=yes" >> "$GITHUB_OUTPUT"
              echo "slot=$slot" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # For scheduled runs use the cron expression that triggered the job,
          # not the actual runner start hour. GitHub schedules can be delayed.
          case "${{ github.event.schedule }}" in
            "7 6 * * *"|"7 7 * * *") slot="08" ;;
            "7 10 * * *"|"7 11 * * *") slot="12" ;;
            "7 17 * * *"|"7 18 * * *") slot="19" ;;
            *)
              echo "Unbekannter CEO-Schedule: ${{ github.event.schedule }}"
              echo "run=no" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          f="reports/${day}-ceo-${slot}.txt"
          if [ -f "$f" ]; then
            echo "CEO-Slot $slot heute bereits gesendet: $f"
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "slot=$slot" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - if: steps.gate.outputs.run == 'yes'
        run: pip install -r requirements.txt

      - name: CEO-Report erzeugen und Telegram senden
        if: steps.gate.outputs.run == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIKEY: ${{ secrets.APIKEY }}
          SUREBET_API_TOKEN: ${{ secrets.SUREBET_API_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI }}
          MONGO_URI: ${{ secrets.MONGO_URI || secrets.MONGODB_URI }}
          MONGODB_DB: tennis_db
          MONGO_DB_NAME: tennis_db
          SPORTS_DATABASE_URL: ${{ secrets.SPORTS_DATABASE_URL }}
        run: python -m oddswatch.ceo_runner --send --slot "${{ steps.gate.outputs.slot }}"

      - name: Sharpery PLAY-Export erzeugen
        if: steps.gate.outputs.run == 'yes'
        run: python -m oddswatch.export_sharpery --out exports/sharpery

      - name: Sharpery PLAY-Export bereitstellen
        if: steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: sharpery-play-export-${{ github.run_id }}
          path: |
            exports/sharpery.xlsx
            exports/sharpery.csv
          if-no-files-found: error

      - name: Journal und CEO-Bericht sichern
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "oddswatch-bot"
          git config user.email "oddswatch-bot@users.noreply.github.com"
          git add data/journal reports
          git diff --cached --quiet || git commit -m "CEO Telegram $(TZ=Europe/Vienna date '+%d.%m.%Y %H:%M')"
          git pull --rebase --autostash
          git push
