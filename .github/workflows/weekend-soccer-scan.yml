name: weekend-soccer-scan

on:
  push:
    paths:
      - ".github/weekend-soccer-run-now.txt"
  workflow_dispatch:

concurrency:
  group: weekend-soccer-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests
        run: PYTHONPATH=. pytest -q tests/test_weekend_soccer.py tests/test_soccer_steam.py
      - name: All-league weekend soccer scan + Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIKEY: ${{ secrets.APIKEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SPORTS_DATABASE_URL: ${{ secrets.SPORTS_DATABASE_URL }}
        run: python -m oddswatch.weekend_soccer
