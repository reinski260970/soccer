# UEFA-Club v1: Champions League, Europa League, Conference League.
# ClubElo + xG (Liga + Europapokal) -> 1X2 / Über-Unter / BTTS, Vergleich Pinnacle/Bet365.
# Läuft täglich (sammelt dabei Vor-Spiel-Elo für die Kalibrierung) und manuell
# über .github/uefa-run-now.txt oder "Run workflow". Kein Make, kein Telegram.
name: uefa-model

on:
  push:
    paths:
      - ".github/uefa-run-now.txt"
  workflow_dispatch:
    inputs:
      days:
        description: "Tage ab heute"
        default: "3"
  schedule:
    - cron: "37 5 * * *"

concurrency:
  group: uefa-model
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests/test_uefa_model.py
      - name: UEFA-Modell rechnen
        env:
          APIKEY: ${{ secrets.APIKEY }}
        run: python -m oddswatch.uefa_model --days "${{ github.event.inputs.days || '3' }}"
      - name: Bericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefa-model-report
          path: reports/uefa/
          if-no-files-found: warn
      - name: Bericht und Journal committen
        if: success()
        run: |
          git config user.name "oddswatch-bot"
          git config user.email "oddswatch-bot@users.noreply.github.com"
          git add reports/uefa/ data/journal/uefa_*.json
          git diff --cached --quiet || git commit -m "UEFA-Modell $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash && git push
