name: m8-oos-parallel
on:
  push:
    branches:
      - m8-oos-parallel
  workflow_dispatch:
concurrency:
  group: m8-oos-parallel
  cancel-in-progress: true
jobs:
  m8:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        leagues:
          - "bundesliga,2bundesliga,epl,championship"
          - "laliga,seriea,ligue1"
          - "eredivisie,primeira,belgium"
          - "turkey,scotland,greece"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: M8 Basistests
        run: python -m pytest -q tests/test_m8.py
      - name: M8 OOS Ligagruppe
        run: python -m oddswatch m8-research --leagues "${{ matrix.leagues }}"
