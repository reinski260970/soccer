name: Realtime NHL smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: One authenticated NHL request
        env:
          RSA_API_KEY: ${{ secrets.RSA_API_KEY }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          key=os.environ.get('RSA_API_KEY','')
          if not key: raise SystemExit('Missing RSA_API_KEY')
          url='https://www.realtimesportsapi.com/api/v1/sports/hockey/leagues/nhl/events?includeOdds=true'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+key,'Accept':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  data=json.load(response)
                  print('HTTP',response.status)
          except urllib.error.HTTPError as e:
              print('HTTP',e.code,'body:',e.read(1200).decode('utf-8','replace'))
              raise SystemExit(1)
          print('Top-level fields:',list(data) if isinstance(data,dict) else type(data).__name__)
          if isinstance(data,dict):
              meta=data.get('meta',{})
              print('Rate limit:',json.dumps(meta.get('rateLimit',{})))
              items=data.get('data',data.get('events',[]))
              if isinstance(items,dict):items=items.get('events',items.get('items',[]))
              if isinstance(items,list):
                  print('Events returned:',len(items))
                  for event in items[:3]:
                      if isinstance(event,dict):
                          print('Event:',event.get('id'),event.get('date'),event.get('name'),'odds fields:',list((event.get('odds') or {}).keys()))
          PY