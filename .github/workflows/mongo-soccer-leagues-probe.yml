name: mongo-soccer-leagues-probe

# Einmalige Probe: welche Ligen/Zeiträume liegen in MONGO_SOCCER (mains, extra_leagues)?
# Gibt nur Feldnamen, Liga-Bezeichnungen, Anzahlen und Datumsbereiche aus.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MONGO_SOCCER: ${{ secrets.MONGO_SOCCER }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pymongo>=4.6"
      - name: Probe
        run: |
          python - > out.txt 2>&1 <<'PY' || true
          import os, sys, traceback
          sys.excepthook = lambda t, e, tb: print("FEHLER:", t.__name__, str(e)[:300].split("@")[-1])
          def shape(v):
              v = v or ""
              return {"len": len(v), "mongodb://": v.strip().startswith("mongodb://"),
                      "mongodb+srv://": v.strip().startswith("mongodb+srv://"),
                      "quote_or_space_start": v[:1] in ("'", '"', " ", "\n"), "has_newline": "\n" in v.strip()}
          print("MONGO_SOCCER:", shape(os.environ.get("MONGO_SOCCER")))
          print("MONGODB_URI:", shape(os.environ.get("MONGODB_URI")))
          for name in ("MONGO_SOCCER", "MONGODB_URI"):
              v = (os.environ.get(name) or "").strip().strip("'\"")
              if v.startswith("mongodb"):
                  os.environ["MONGO_SOCCER"] = v
                  print("verwende", name)
                  break
          from pymongo import MongoClient
          from oddswatch.sources.football_mongo import choose_database
          c = MongoClient(os.environ["MONGO_SOCCER"], serverSelectionTimeoutMS=15000)
          try:
              db = c.get_default_database()
          except Exception:
              db = None
          if db is None:
              db = c[choose_database(c.list_database_names())]
          print("db:", db.name, "collections:", db.list_collection_names())
          col = db["extra_leagues"]
          for country in ("Sweden", "Norway", "Denmark"):
              pipe = [{"$match": {"Country": country}},
                      {"$group": {"_id": {"l": "$League", "s": "$Season"}, "n": {"$sum": 1},
                                  "first": {"$min": "$Date"}, "last": {"$max": "$Date"}}},
                      {"$sort": {"_id.s": -1}}, {"$limit": 3}]
              for r in col.aggregate(pipe, maxTimeMS=20000):
                  print(f"{country} | {r['_id']} n={r['n']} {r['first']} .. {r['last']}")
              for d in col.find({"Country": country}, {"_id": 0, "Date": 1, "Time": 1, "Season": 1, "Home": 1, "Away": 1, "HG": 1, "AG": 1, "Res": 1}).sort("_id", -1).limit(3):
                  print("   ", d)
          print("Countries:", sorted(str(x) for x in col.distinct("Country")))
          PY
          cat out.txt
          echo "::notice title=mongo::$(sed ':a;N;$!ba;s/\n/%0A/g' out.txt | cut -c1-60000)"
