# Fußball-Quotenwächter über API-Football; Mongo separat und nur lesend.
name: quick-scan
on:
  push:
    branches:
      - fullscan-fresh-run
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: quick-scan-fullscan-test
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Schnellscan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIKEY: ${{ secrets.APIKEY }}
        run: python -m oddswatch quick --full --send
      - name: Journal sichern
        if: always()
        run: |
          git config user.name "oddswatch-bot"
          git config user.email "oddswatch-bot@users.noreply.github.com"
          git add data/journal
          git diff --cached --quiet || git commit -m "Schnellscan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash && git push

  football-mongo:
    name: Fußball Mongo (lesend)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Fußball-Verbindung und Schema prüfen
        env:
          MONGO: ${{ secrets.MONGO }}
          MONGO_DB: ${{ vars.MONGO_DB }}
        run: python -m oddswatch football-mongo
