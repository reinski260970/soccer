name: clv-first-oos-v2
on:
  push:
    branches:
      - clv-first-oos-v2
  workflow_dispatch:
concurrency:
  group: clv-first-oos-v2
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [m13, m14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests/test_m13.py tests/test_m14.py tests/test_export_sharpery.py
      - name: CLV-first OOS v2
        env:
          MONGO_SOCCER: ${{ secrets.MONGO_SOCCER }}
        run: |
          if [ "${{ matrix.suite }}" = "m13" ]; then
            python -m oddswatch m13-research
          else
            python -m oddswatch m14-research
          fi
