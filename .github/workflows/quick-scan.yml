# Fußball-Quotenwächter über API-Football; Mongo separat und nur lesend.
name: quick-scan
on:
  push:
    branches:
      - europe-model-validation-v2
  workflow_dispatch:
concurrency:
  group: europe-model-validation-v2
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Europa-Fußball Backtest
        run: python -m oddswatch backtest
      - name: Validierung sichern
        run: |
          git config user.name "oddswatch-bot"
          git config user.email "oddswatch-bot@users.noreply.github.com"
          git add data/validation.json
          git diff --cached --quiet || git commit -m "Europa-Fußball Validierung $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash && git push

  football-mongo:
    name: Fußball Mongo (lesend)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Fußball-Verbindung und Schema prüfen
        env:
          MONGO: ${{ secrets.MONGO }}
          MONGO_DB: ${{ vars.MONGO_DB }}
        run: python -m oddswatch football-mongo
