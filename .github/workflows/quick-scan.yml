name: m16-decorrelated-research
on:
  push:
    branches:
      - m16-decorrelated
    paths:
      - data/m16_trigger.txt
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests/test_m13.py tests/test_m14.py
      - name: M16 research
        env:
          MONGO_SOCCER: ${{ secrets.MONGO_SOCCER }}
        run: python -m oddswatch.m16_research
