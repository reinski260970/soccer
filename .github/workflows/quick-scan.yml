# Schnellscan Kalshi vs. DraftKings alle 15 Minuten (Preisvergleich, Closing-Snapshots,
# Abrechnung). Geplante Workflows laufen nur vom Standard-Branch aus: aktiv, sobald
# diese Datei auf main liegt. Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
name: quick-scan
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: quick-scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Schnellscan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m oddswatch quick --send
      - name: Journal sichern
        run: |
          git config user.name "oddswatch-bot"
          git config user.email "oddswatch-bot@users.noreply.github.com"
          git add data/journal data/snapshots
          git diff --cached --quiet || git commit -m "Schnellscan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash && git push
