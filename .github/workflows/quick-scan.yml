# Fußball-Quotenwächter über API-Football; Mongo separat und nur lesend.
name: quick-scan
on:
  push:
    branches:
      - m13-mongo-audit
  workflow_dispatch:
concurrency:
  group: m13-mongo-audit
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: M13 Soccer Mongo Audit
        env:
          MONGO_SOCCER: ${{ secrets.MONGO_SOCCER }}
        run: python -m oddswatch football-mongo-audit
