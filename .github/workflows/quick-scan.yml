# Fußball-Quotenwächter über API-Football; Mongo separat und nur lesend.
name: quick-scan
on:
  push:
    branches:
      - m12-mongo-oos
  workflow_dispatch:
concurrency:
  group: m12-mongo-oos
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: M12 Basistests
        run: python -m pytest -q tests/test_m12.py
      - name: M12 Mongo OOS
        env:
          MONGO_SOCCER: ${{ secrets.MONGO_SOCCER }}
        run: python -m oddswatch m12-research --leagues "bundesliga,2bundesliga,epl,championship,laliga,seriea,ligue1,eredivisie,primeira,belgium,turkey,scotland,greece"
