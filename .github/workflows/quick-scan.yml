# Fußball-Quotenwächter über API-Football; Mongo separat und nur lesend.
name: quick-scan
on:
  push:
    branches:
      - sharpery-stake-10-test
  workflow_dispatch:
concurrency:
  group: sharpery-stake-10-test
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Sharpery Stake Tests
        run: python -m pytest -q tests/test_export_sharpery.py
