# Fußball-Quotenwächter über API-Football; Mongo separat und nur lesend.
name: quick-scan
on:
  push:
    branches:
      - m14-europe-oos
  workflow_dispatch:
concurrency:
  group: m14-europe-oos
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: M14 Tests
        run: python -m pytest -q tests/test_m14.py
      - name: M14 Europa OOS
        env:
          MONGO_SOCCER: ${{ secrets.MONGO_SOCCER }}
        run: python -m oddswatch m14-research --leagues "2bundesliga,championship,eredivisie,primeira,belgium,turkey,scotland,greece"
