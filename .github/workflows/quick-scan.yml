# Fußball-Quotenwächter über API-Football; Mongo separat und nur lesend.
name: quick-scan
on:
  push:
    branches:
      - model-research-v3
  workflow_dispatch:
concurrency:
  group: model-research-v3
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Europa-Modellresearch
        run: python -m oddswatch research

  football-mongo:
    name: Fußball Mongo (lesend)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Fußball-Verbindung und Schema prüfen
        env:
          MONGO: ${{ secrets.MONGO }}
          MONGO_DB: ${{ vars.MONGO_DB }}
        run: python -m oddswatch football-mongo
