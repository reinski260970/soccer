# Fußball-Quotenwächter über API-Football; Mongo separat und nur lesend.
name: quick-scan
on:
  push:
    branches:
      - m8-oos-v1
  workflow_dispatch:
concurrency:
  group: m8-oos-v1
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: M8 Basistests
        run: pytest -q tests/test_m8.py
      - name: M8 Europa OOS
        run: python -m oddswatch m8-research
      - name: M8 Validierung sichern
        run: |
          git config user.name "oddswatch-bot"
          git config user.email "oddswatch-bot@users.noreply.github.com"
          git add data/m8_validation.json
          git diff --cached --quiet || git commit -m "M8 Validierung $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash && git push
