name: m17-1-real-shots-research
on:
  push:
    branches:
      - m17-1-real-shots
    paths:
      - data/m17_1_trigger.txt
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests/test_m13.py tests/test_m14.py
      - name: M17.1 research
        env:
          MONGO_SOCCER: ${{ secrets.MONGO_SOCCER }}
        run: python -m oddswatch.m17_1_research
      - name: M17.1 Sharpery individual tips
        env:
          MONGO_SOCCER: ${{ secrets.MONGO_SOCCER }}
        run: python -m oddswatch.m17_1_sharpery
      - name: Upload M17.1 result
        uses: actions/upload-artifact@v4
        with:
          name: m17-1-validation
          path: data/m17_1_validation.json
          if-no-files-found: error
      - name: Upload M17.1 Sharpery tips
        uses: actions/upload-artifact@v4
        with:
          name: m17-1-sharpery-tips
          path: exports/m17_1_sharpery_research.csv
          if-no-files-found: error
