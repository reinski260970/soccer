# Fußball-Quotenwächter über API-Football; Mongo separat und nur lesend.
name: quick-scan
on:
  push:
    branches:
      - m13-canonical-oos
  workflow_dispatch:
concurrency:
  group: m13-canonical-oos
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        league: [bundesliga, epl, laliga, seriea, ligue1]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: M13 Tests
        run: python -m pytest -q tests/test_m13.py
      - name: M13 Canonical OOS
        env:
          MONGO_SOCCER: ${{ secrets.MONGO_SOCCER }}
        run: python -m oddswatch m13-research --leagues "${{ matrix.league }}"
