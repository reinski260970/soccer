name: sharpery-export-package
on:
  push:
    branches:
      - sharpery-oos-backtest
    paths:
      - data/package_sharpery.txt
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload Sharpery OOS export
        uses: actions/upload-artifact@v4
        with:
          name: sharpery-oos-backtest
          path: |
            archive/backtests/sharpery_oos_backtest.xlsx
            archive/backtests/sharpery_oos_backtest.csv
          if-no-files-found: error
