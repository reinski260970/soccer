name: m17-1-sharpery-export
on:
  push:
    branches:
      - m17-1-real-shots
    paths:
      - data/m17_1_trigger.txt
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: M17.1 Sharpery individual tips
        env:
          MONGO_SOCCER: ${{ secrets.MONGO_SOCCER }}
        run: python -m oddswatch.m17_1_sharpery
      - name: Upload M17.1 Sharpery tips
        uses: actions/upload-artifact@v4
        with:
          name: m17-1-sharpery-tips
          path: exports/m17_1_sharpery_research.csv
          if-no-files-found: error
