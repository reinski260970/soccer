name: austria-weekend-test

on:
  push:
    paths:
      - ".github/austria-weekend-run-now.txt"
  workflow_dispatch:

concurrency:
  group: austria-weekend-test
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Austria-only scan + Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIKEY: ${{ secrets.APIKEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SPORTS_DATABASE_URL: ${{ secrets.SPORTS_DATABASE_URL }}
        run: python -m oddswatch.austria_weekend_test
      - name: Persist Austria steam snapshot
        if: always()
        run: |
          git config user.name "oddswatch-bot"
          git config user.email "oddswatch-bot@users.noreply.github.com"
          git add data/journal/steam_history.json
          git diff --cached --quiet || git commit -m "Austria steam snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
