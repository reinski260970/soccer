name: m11-xg-merge-probe-v2
on:
  push:
    branches:
      - m11-xg-merge-probe-v2
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe xG merge coverage
        run: |
          python - <<'PY'
          from oddswatch import fetch
          from oddswatch.sources import football_data as fd, understat, xg_merge
          for code in ("E0","D1","SP1","I1","F1"):
              for season in (2023, 2024, 2025):
                  text, err = fetch.get(fd.csv_url(code, season), cache_days=30)
                  if not text:
                      print(code, season, "FD_ERR", err)
                      continue
                  fm = fd.parse(text)[0]
                  um, uerr = understat.season_matches(code, season, cache_days=30)
                  _, st = xg_merge.merge_xg(fm, um)
                  print(code, season, "matched", st["matched"], "total", st["total"],
                        "coverage", f'{st["coverage"]:.3f}', "amb", st["ambiguous"], "uerr", uerr)
                  if st["misses"]:
                      print(" misses:", st["misses"][:8])
          PY
